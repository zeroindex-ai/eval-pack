name: Release

on:
  push:
    tags:
      - 'v*'

# id-token is required for npm publish --provenance.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # Fail fast if the tag and package.json disagree. Catches the classic
      # "tagged v0.2.0 but forgot to bump package.json" mistake before the
      # publish step burns a version number.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Build the CHANGELOG anchor the way GitHub renders it. Headings look
          # like "## [0.2.0] - 2026-05-16"; GitHub's slug for that is
          # "020---2026-05-16" (dots dropped, " - " → "---"). Derive the date
          # from the heading itself rather than the publish day, since they can
          # differ. If the heading (or its date) can't be parsed, fall back to
          # the bare version anchor "#020", which still resolves to the section.
          VERSION_NODOTS="$(printf '%s' "$VERSION" | tr -d '.')"
          HEADING_DATE="$(grep -oE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md \
            | head -n1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)"
          if [ -n "$HEADING_DATE" ]; then
            ANCHOR="${VERSION_NODOTS}---${HEADING_DATE}"
          else
            ANCHOR="${VERSION_NODOTS}"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](./CHANGELOG.md#${ANCHOR}) for details."

# Required GitHub Actions secret: NPM_TOKEN (an "Automation" token from npmjs.org with publish scope).
# Set via: gh secret set NPM_TOKEN --body '...' or via the repo Settings → Secrets and variables → Actions UI.
# Provenance requires the workflow to run from the same repo where the package is published.
